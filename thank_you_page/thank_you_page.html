<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KronosouK thanks you</title>
    <link rel="stylesheet" href="thank_you_page.css">
    <link rel="stylesheet" href="../same_codes.css">
    <script src="thank_you_page.js" defer></script>
</head>

<body>
    <header>
        <div id="logo">
            <div id="logo-img">
                <a href="../main/index.html">
                    <img src="../photos/logo.png" alt="Company Logo">
                </a>
            </div>
        </div>
    </header>
<main>
    <section id="thank_you_paragraph">
        <p>Thank you <span id="costumer-name"></span> for you order!<br>
        <span id="second-paragraph">We will call you soon on this phone number 
         <span id="costumer-phone"></span> to confirm your order.</span></p>
        <div id="recap-container">
            <h4>Recapitulation</h4>
            <div class="recap costumer-info" id="recap-costumer-name">Name: <span id="recap-costumer-name-span"></span></div>
            <div class="recap costumer-info" id="recap-costumer-city">City: <span id="recap-costumer-city-span"></span></div>
            <div class="recap costumer-info" id="recap-costumer-phone">Phone number: <span id="recap-costumer-phone-span"></span></div>
            <div id="recap-product-info">
                <div id="recap-product-img"></div>
                <div id="product-infos">
                    <div id="recap-product-name"><h4>Product name: </h4><span id="recap-product-name-span"></span></div>
                    <div id="recap-product-price"><h4>Price: </h4><span id="recap-product-price-span"></span></div>
                    <div id="recap-product-quantity"><h4>Quantity: </h4><span id="recap-product-quantity-span"></span></div>
                </div>
            </div>
        </section>
</main>
    <section id="contact">
        <h2>Contact</h2>
        <ul>
            <li><a href="https://www.facebook.com/KronosouK/" target="_blank"><img
                        src="../photos/social-media/facebook.png" alt="Facebook"></a></li>
            <li><a href="https://wa.me/+212703924911" target="_blank"><img src="../photos/social-media/whatsapp.png"
                        alt="WhatsApp"></a></li>
            <li><a href="https://www.instagram.com/p/DBrxYfUqket/" target="_blank"><img
                        src="../photos/social-media/instagram.png" alt="Instagram"></a></li>
        </ul>
    </section>

    </footer>
